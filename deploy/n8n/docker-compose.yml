services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: kuro-n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
      - "100.78.60.50:5678:5678"
    env_file:
      - .env
    environment:
      TZ: Asia/Kolkata
      GENERIC_TIMEZONE: Asia/Kolkata
      N8N_HOST: 100.78.60.50
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_LISTEN_ADDRESS: "0.0.0.0"
      N8N_WEBHOOK_URL: http://100.78.60.50:5678/
      N8N_EDITOR_BASE_URL: http://100.78.60.50:5678/
      N8N_SECURE_COOKIE: "false"
    volumes:
      - n8n_data:/home/node/.n8n
    cpus: "1.0"
    mem_limit: 1024m

volumes:
  n8n_data:
    name: n8n_data
