<svg xmlns="http://www.w3.org/2000/svg" viewBox="135 35 280 278" data-state="idle" role="img" aria-label="Kuro mark">
  <style>
    .kuro-bar-pulse, .kuro-arm-bar { transform-box: fill-box; transform-origin: center; }
    svg[data-state="listening"] .kuro-bar-pulse { animation: kuroPulse 0.85s ease-in-out infinite; }
    svg[data-state="listening"] .kuro-arm-bar { animation: kuroSpeak 1.15s ease-in-out infinite; }
    svg[data-state="speaking"] .kuro-bar-pulse { animation: kuroPulse 0.55s ease-in-out infinite; }
    svg[data-state="speaking"] .kuro-arm-bar { animation: kuroSpeak 0.7s ease-in-out infinite; }
    .kuro-bar-pulse:nth-child(1) { animation-delay: 0s; }
    .kuro-bar-pulse:nth-child(2) { animation-delay: 0.08s; }
    .kuro-bar-pulse:nth-child(3) { animation-delay: 0.16s; }
    .kuro-bar-pulse:nth-child(4) { animation-delay: 0.24s; }
    .kuro-bar-pulse:nth-child(5) { animation-delay: 0.16s; }
    .kuro-bar-pulse:nth-child(6) { animation-delay: 0.08s; }
    @keyframes kuroPulse {
      0%, 100% { transform: scaleY(0.4); }
      50% { transform: scaleY(1); }
    }
    @keyframes kuroSpeak {
      0%, 100% { transform: scaleY(0.72); }
      50% { transform: scaleY(1); }
    }
  </style>
  <rect x="135" y="35" width="280" height="278" fill="#F5F4EE"/>
  <defs>
    <pattern id="kuro-hatch" width="7" height="7" patternUnits="userSpaceOnUse">
      <path d="M-1 8 L8 -1" stroke="#141414" stroke-width="1.4"/>
    </pattern>
  </defs>
  <g id="kuro-architectural-frame" fill="none" stroke="#141414">
    <rect x="164" y="64" width="246" height="246" fill="url(#kuro-hatch)" stroke="none"/>
    <rect x="148" y="48" width="240" height="240" fill="#F5F4EE" stroke-width="8"/>
    <rect x="166" y="66" width="204" height="204" stroke-width="4"/>
    <rect x="136" y="36" width="36" height="36" fill="#141414" stroke="none"/>
  </g>
  <g id="kuro-mark-geometry" fill="#141414">
    <rect x="186" y="96" width="18" height="148"/>
    <g class="kuro-arms">
      <rect class="kuro-arm-bar" x="214" y="150" width="10" height="22"/>
      <rect class="kuro-arm-bar" x="230" y="138" width="10" height="22"/>
      <rect class="kuro-arm-bar" x="246" y="126" width="10" height="22"/>
      <rect class="kuro-arm-bar" x="262" y="114" width="10" height="22"/>
      <rect class="kuro-arm-bar" x="278" y="102" width="10" height="22"/>
      <rect class="kuro-arm-bar" x="214" y="176" width="10" height="18"/>
      <rect class="kuro-arm-bar" x="230" y="176" width="10" height="30"/>
      <rect class="kuro-arm-bar" x="246" y="176" width="10" height="42"/>
      <rect class="kuro-arm-bar" x="262" y="176" width="10" height="54"/>
      <rect class="kuro-arm-bar" x="278" y="176" width="10" height="62"/>
    </g>
    <g id="kuro-notch">
      <rect class="kuro-bar-pulse" x="312" y="158" width="6" height="10"/>
      <rect class="kuro-bar-pulse" x="322" y="150" width="6" height="26"/>
      <rect class="kuro-bar-pulse" x="332" y="140" width="6" height="46"/>
      <rect class="kuro-bar-pulse" x="342" y="140" width="6" height="46"/>
      <rect class="kuro-bar-pulse" x="352" y="150" width="6" height="26"/>
      <rect class="kuro-bar-pulse" x="362" y="158" width="6" height="10"/>
    </g>
  </g>
</svg>
