version: 2
updates:
  - package-ecosystem: cargo
    directory: /kuro-rs
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      cargo-dependencies:
        patterns:
          - "*"
  - package-ecosystem: nuget
    directory: /KuroShell
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nuget-dependencies:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
